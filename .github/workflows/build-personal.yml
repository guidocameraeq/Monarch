name: Build Personal Branch

on:
  workflow_dispatch:
  push:
    branches: [personal]

permissions:
  contents: read

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build

      - name: Run core Rust tests
        run: cargo test --manifest-path Cargo.toml

      - name: Build Windows app (MSI)
        run: yarn tauri build --bundles msi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monarch-personal-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/monarch*.exe
            src-tauri/target/release/bundle/msi/*.msi
